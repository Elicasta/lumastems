[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lumastems"
version = "0.2.6"
description = "Local stem separation engine for LumaStudio and Ableton workflows."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Eli Castaneda" }]
dependencies = [
  "audio-separator[cpu]>=0.44,<1.0",
  "audioread>=3.0,<4.0",
  "bs-roformer-infer==0.1.5",
  "imageio-ffmpeg>=0.5,<1.0",
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "pydantic>=2.8,<3.0",
  "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.7,<1.0",
]

[project.scripts]
lumastems = "lumastems.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lumastems"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
