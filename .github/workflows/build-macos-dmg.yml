name: Build macOS DMG

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lumastems-macos-dmg
  cancel-in-progress: true

jobs:
  build:
    name: Apple Silicon DMG
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build bundled engine wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir python-dist
          test -f python-dist/lumastems-0.3.0-py3-none-any.whl

      - name: Install and verify source runtime
        shell: bash
        run: |
          python -m pip install --upgrade uv
          rm -rf /tmp/lumastems-engine-test /tmp/lumastems-ci-models
          uv venv /tmp/lumastems-engine-test --python 3.12
          uv pip install             --python /tmp/lumastems-engine-test/bin/python             python-dist/lumastems-0.3.0-py3-none-any.whl

          PYTHON=/tmp/lumastems-engine-test/bin/python
          FFMPEG="$("$PYTHON" -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"

          test -x "$FFMPEG"
          cp "$FFMPEG" /tmp/lumastems-engine-test/bin/ffmpeg
          chmod +x /tmp/lumastems-engine-test/bin/ffmpeg
          /tmp/lumastems-engine-test/bin/ffmpeg -version
          /tmp/lumastems-engine-test/bin/lumastems presets

          PATH="/tmp/lumastems-engine-test/bin:$PATH" "$PYTHON" - <<'PY'
          import audioread
          import imageio_ffmpeg
          from audio_separator.separator import Separator

          Separator()
          import lumastems
          print("Core runtime passed")
          PY

      - name: Create vocal specialist fixture
        shell: bash
        run: |
          /tmp/lumastems-engine-test/bin/python - <<'PY'
          import math
          import struct
          import wave

          path = "/tmp/lumastems-vocal-fixture.wav"
          rate = 44100
          seconds = 8

          with wave.open(path, "wb") as wav:
              wav.setnchannels(2)
              wav.setsampwidth(2)
              wav.setframerate(rate)

              for i in range(rate * seconds):
                  t = i / rate
                  lead = 0.34 * math.sin(2 * math.pi * 220 * t)
                  harmony = 0.18 * math.sin(2 * math.pi * 330 * t)
                  movement = 0.08 * math.sin(2 * math.pi * 2.5 * t)
                  left = max(-1.0, min(1.0, lead + harmony + movement))
                  right = max(-1.0, min(1.0, lead + 0.85 * harmony - movement))
                  wav.writeframesraw(
                      struct.pack(
                          "<hh",
                          int(left * 32767),
                          int(right * 32767),
                      )
                  )

          print(path)
          PY

      - name: Verify real backing-vocal model
        shell: bash
        run: |
          rm -rf /tmp/lumastems-bve-source

          PATH="/tmp/lumastems-engine-test/bin:$PATH"           /tmp/lumastems-engine-test/bin/python - <<'PY'
          from pathlib import Path
          from audio_separator.separator import Separator

          model_dir = Path("/tmp/lumastems-ci-models")
          output_dir = Path("/tmp/lumastems-bve-source")
          output_dir.mkdir(parents=True, exist_ok=True)

          separator = Separator(
              model_file_dir=str(model_dir),
              output_dir=str(output_dir),
              output_format="WAV",
          )
          separator.load_model("UVR-BVE-4B_SN-44100-2.pth")

          produced = separator.separate(
              "/tmp/lumastems-vocal-fixture.wav",
              custom_output_names={
                  "Instrumental": "lead_vocals",
                  "Vocals": "backing_vocals",
              },
          )

          files = [Path(item).name.lower() for item in produced]
          files += [path.name.lower() for path in output_dir.glob("*.wav")]
          print("BVE outputs:", files)

          assert any("lead_vocals" in name for name in files), files
          assert any("backing_vocals" in name for name in files), files
          print("Real BVE lead/backing separation passed")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install desktop dependencies
        run: npm install

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build Apple Silicon app and DMG
        run: npm run tauri:build -- --target aarch64-apple-darwin

      - name: Verify packaged wheel
        shell: bash
        run: |
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/LumaStems.app"
          WHEEL="$APP/Contents/Resources/engine/lumastems-0.3.0-py3-none-any.whl"

          test -d "$APP"
          test -f "$WHEEL"
          test "$(basename "$WHEEL")" = "lumastems-0.3.0-py3-none-any.whl"

          rm -rf /tmp/lumastems-packaged-engine-test
          uv venv /tmp/lumastems-packaged-engine-test --python 3.12
          uv pip install             --python /tmp/lumastems-packaged-engine-test/bin/python             "$WHEEL"

          PYTHON=/tmp/lumastems-packaged-engine-test/bin/python
          FFMPEG="$("$PYTHON" -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"

          cp "$FFMPEG" /tmp/lumastems-packaged-engine-test/bin/ffmpeg
          chmod +x /tmp/lumastems-packaged-engine-test/bin/ffmpeg

          PATH="/tmp/lumastems-packaged-engine-test/bin:$PATH" "$PYTHON" - <<'PY'
          import audioread
          from audio_separator.separator import Separator

          Separator()
          import lumastems
          print("Packaged core runtime passed")
          PY

      - name: Verify packaged vocal specialist
        shell: bash
        run: |
          rm -rf /tmp/lumastems-bve-packaged

          PATH="/tmp/lumastems-packaged-engine-test/bin:$PATH"           /tmp/lumastems-packaged-engine-test/bin/python - <<'PY'
          from pathlib import Path
          from audio_separator.separator import Separator

          output_dir = Path("/tmp/lumastems-bve-packaged")
          output_dir.mkdir(parents=True, exist_ok=True)

          separator = Separator(
              model_file_dir="/tmp/lumastems-ci-models",
              output_dir=str(output_dir),
              output_format="WAV",
          )
          separator.load_model("UVR-BVE-4B_SN-44100-2.pth")

          produced = separator.separate(
              "/tmp/lumastems-vocal-fixture.wav",
              custom_output_names={
                  "Instrumental": "lead_vocals",
                  "Vocals": "backing_vocals",
              },
          )

          files = [Path(item).name.lower() for item in produced]
          files += [path.name.lower() for path in output_dir.glob("*.wav")]
          print("Packaged BVE outputs:", files)

          assert any("lead_vocals" in name for name in files), files
          assert any("backing_vocals" in name for name in files), files
          print("Packaged BVE separation passed")
          PY

      - name: Smoke test packaged app
        shell: bash
        run: |
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/LumaStems.app"
          BIN="$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"

          test -n "$BIN"
          test -x "$BIN"

          "$BIN" >/tmp/lumastems-startup.log 2>&1 &
          PID=$!
          sleep 8

          if ! kill -0 "$PID" 2>/dev/null; then
            cat /tmp/lumastems-startup.log || true
            exit 1
          fi

          kill "$PID"
          wait "$PID" || true
          echo "Startup smoke test passed"

      - name: Stage installer
        shell: bash
        run: |
          DMG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$DMG"
          cp "$DMG" LumaStems-0.3.0-Apple-Silicon.dmg
          ls -lh LumaStems-0.3.0-Apple-Silicon.dmg

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumaStems-0.3.0-Apple-Silicon
          path: LumaStems-0.3.0-Apple-Silicon.dmg
          if-no-files-found: error

      - name: Publish preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0-preview
          name: "LumaStems 0.3.0 Preview"
          body: |
            Stability-first release.

            Main UI:
            - Band 6: Vocals, Drums, Bass, Guitar, Piano, Other
            - Worship Vocals 7: Lead Vocal, BGV / Choir, Drums, Bass, Guitar, Piano, Other

            The experimental synth specialist and its BS-RoFormer runtime have been removed
            from the shipping app. Worship Vocals uses UVR-BVE-4B_SN-44100-2 on the isolated
            vocal stem.

            Release gates run the real backing-vocal model using both the source wheel and
            the exact wheel packaged inside LumaStems.app before the DMG can publish.
          prerelease: true
          make_latest: true
          files: LumaStems-0.3.0-Apple-Silicon.dmg
          overwrite_files: true
