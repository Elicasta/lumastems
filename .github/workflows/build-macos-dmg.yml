name: Build macOS DMG

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lumastems-macos-dmg
  cancel-in-progress: true

jobs:
  build:
    name: Apple Silicon DMG
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build bundled engine wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir python-dist
          test -f python-dist/lumastems-0.2.5-py3-none-any.whl

      - name: Verify source wheel, FFmpeg, and real separator
        shell: bash
        run: |
          python -m pip install --upgrade uv
          rm -rf /tmp/lumastems-engine-test
          uv venv /tmp/lumastems-engine-test --python 3.12
          uv pip install             --python /tmp/lumastems-engine-test/bin/python             python-dist/lumastems-0.2.5-py3-none-any.whl

          PYTHON=/tmp/lumastems-engine-test/bin/python
          FFMPEG="$("$PYTHON" -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"

          test -x "$FFMPEG"
          "$FFMPEG" -version
          cp "$FFMPEG" /tmp/lumastems-engine-test/bin/ffmpeg
          chmod +x /tmp/lumastems-engine-test/bin/ffmpeg
          /tmp/lumastems-engine-test/bin/ffmpeg -version
          /tmp/lumastems-engine-test/bin/lumastems presets

          PATH="/tmp/lumastems-engine-test/bin:$PATH" "$PYTHON" - <<'PY'
          import audioread
          import imageio_ffmpeg
          from audio_separator.separator import Separator

          Separator()
          import bs_roformer
          import lumastems
          from lumastems.specialists import SynthSpecialist
          SynthSpecialist.validate_runtime_api()
          print("Source wheel real Separator + managed FFmpeg + synth API passed")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install desktop dependencies
        run: npm install

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build Apple Silicon app and DMG
        run: npm run tauri:build -- --target aarch64-apple-darwin

      - name: Verify packaged wheel, FFmpeg, and real separator
        shell: bash
        run: |
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/LumaStems.app"
          WHEEL="$APP/Contents/Resources/engine/lumastems-0.2.5-py3-none-any.whl"

          test -d "$APP"
          test -f "$WHEEL"
          test "$(basename "$WHEEL")" = "lumastems-0.2.5-py3-none-any.whl"

          rm -rf /tmp/lumastems-packaged-engine-test
          uv venv /tmp/lumastems-packaged-engine-test --python 3.12
          uv pip install             --python /tmp/lumastems-packaged-engine-test/bin/python             "$WHEEL"

          PYTHON=/tmp/lumastems-packaged-engine-test/bin/python
          FFMPEG="$("$PYTHON" -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"

          test -x "$FFMPEG"
          "$FFMPEG" -version
          cp "$FFMPEG" /tmp/lumastems-packaged-engine-test/bin/ffmpeg
          chmod +x /tmp/lumastems-packaged-engine-test/bin/ffmpeg
          /tmp/lumastems-packaged-engine-test/bin/ffmpeg -version
          /tmp/lumastems-packaged-engine-test/bin/lumastems presets

          PATH="/tmp/lumastems-packaged-engine-test/bin:$PATH" "$PYTHON" - <<'PY'
          import audioread
          import imageio_ffmpeg
          from audio_separator.separator import Separator

          Separator()
          import bs_roformer
          import lumastems
          from lumastems.specialists import SynthSpecialist
          SynthSpecialist.validate_runtime_api()
          print("Packaged wheel real Separator + managed FFmpeg + synth API passed")
          PY

      - name: Smoke test packaged app
        shell: bash
        run: |
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/LumaStems.app"
          test -d "$APP"
          BIN="$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"
          test -n "$BIN"
          test -x "$BIN"

          "$BIN" >/tmp/lumastems-startup.log 2>&1 &
          PID=$!
          sleep 8

          if ! kill -0 "$PID" 2>/dev/null; then
            cat /tmp/lumastems-startup.log || true
            exit 1
          fi

          kill "$PID"
          wait "$PID" || true
          echo "Startup smoke test passed"

      - name: Stage installer
        shell: bash
        run: |
          DMG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$DMG"
          cp "$DMG" LumaStems-0.2.5-Apple-Silicon.dmg
          ls -lh LumaStems-0.2.5-Apple-Silicon.dmg

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumaStems-0.2.5-Apple-Silicon
          path: LumaStems-0.2.5-Apple-Silicon.dmg
          if-no-files-found: error

      - name: Publish preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.5-preview
          name: "LumaStems 0.2.5 Preview"
          body: |
            Fixes Worship 7 synth-specialist runtime compatibility with bs-roformer-infer 0.1.5.

            LumaStems now uses the actual supported bs-roformer-infer 0.1.5 API
            for the synth specialist instead of the nonexistent clean_api session layer.

            Release gates verify:
            - the source wheel installs
            - managed Apple Silicon FFmpeg exists and runs
            - the real audio_separator Separator initializes with that FFmpeg on PATH
            - the exact wheel inside the packaged app passes the same checks
            - the Worship 7 synth specialist import/API path is validated
            - the macOS app launches successfully
          prerelease: true
          make_latest: true
          files: LumaStems-0.2.5-Apple-Silicon.dmg
          overwrite_files: true
