[package]
name = "lumastems-desktop"
version = "0.2.6"
description = "LumaStems macOS desktop app"
authors = ["EC Creative Studios"]
edition = "2021"

[lib]
name = "lumastems_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
